name: Build & Publish Logic Proxy Image to GHCR

on:
  push:
    # Se dispara únicamente cuando subes tags con formato vX.Y.Z (ej: v0.1.8)
    tags:
      - 'v*.*.*'  

env:
  IMAGE_NAME: ghcr.io/pgtec-vrain/logic-proxy

permissions:
  contents: read
  packages: write  

jobs:
  build-and-push:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requerido por FIWARE para empaquetar en múltiples arquitecturas (ARM/AMD)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Apuesta segura: usa el Dockerfile del repositorio original de FIWARE
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          # Se genera la versión del tag concreto y se actualiza la de 'latest'
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
      
      - name: Print image info
        run: |
          echo "Image published to:"
          echo "   ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "   ${{ env.IMAGE_NAME }}:latest"